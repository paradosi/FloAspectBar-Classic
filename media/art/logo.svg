<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- FloAspectBar logo: a gold hawk, wings spread (Aspect of the Hawk), on wowdb.dev navy.
       Source for media/art/logo_400.png, logo_64.png and media/textures/logo_64.tga. -->
  <defs>
    <radialGradient id="well" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#232b42"/>
      <stop offset="0.6" stop-color="#161b29"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3ad"/>
      <stop offset="0.45" stop-color="#e3b664"/>
      <stop offset="1" stop-color="#9c7130"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d595"/>
      <stop offset="0.5" stop-color="#e3b664" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3d595" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e3b664" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e3b664" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="368" height="368" rx="42" fill="url(#rim)"/>
  <rect x="22" y="22" width="356" height="356" rx="37" fill="url(#well)"/>
  <circle cx="200" cy="205" r="170" fill="url(#glow)"/>
  <g filter="url(#shadow)" fill="url(#gold)" stroke="#5c3c0c" stroke-width="3" stroke-linejoin="round">
    <!-- wings swept up, feathers notched along the trailing edge -->
    <path d="M184 168 C152 128 108 94 52 62 C60 86 70 100 82 110 L66 118 C80 132 92 140 104 146 L88 156 C104 168 118 174 132 178 L120 190 C140 198 160 204 182 210 Z"/>
    <path d="M216 168 C248 128 292 94 348 62 C340 86 330 100 318 110 L334 118 C320 132 308 140 296 146 L312 156 C296 168 282 174 268 178 L280 190 C260 198 240 204 218 210 Z"/>
    <!-- tail fan -->
    <path d="M184 262 L164 324 L186 312 L200 334 L214 312 L236 324 L216 262 Z"/>
    <!-- body -->
    <path d="M200 132 C226 132 238 158 236 192 C234 230 224 258 200 276 C176 258 166 230 164 192 C162 158 174 132 200 132 Z"/>
    <!-- head, turned to the left, with a hooked beak -->
    <path d="M222 104 C222 86 206 76 192 80 C180 84 172 94 170 104 C160 104 150 110 148 122 C156 118 164 120 168 126 C176 138 196 146 212 140 C222 134 224 118 222 104 Z"/>
  </g>
  <circle cx="190" cy="100" r="5" fill="#161b29"/>
  <!-- feather lines on the wings and breast -->
  <g stroke="#9c7130" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M170 176 C140 150 110 126 76 100"/>
    <path d="M230 176 C260 150 290 126 324 100"/>
    <path d="M188 190 q12 7 24 0"/>
    <path d="M188 214 q12 7 24 0"/>
  </g>
</svg>
